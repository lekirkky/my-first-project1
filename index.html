<!DOCTYPE html>
<!-- HTML = the SKELETON of the page. It says WHAT is on the page. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Weather</title>
  <!-- This connects our style file (the PAINT and CLOTHES) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>My Weather</h1>

    <!-- A box where you type a city, and a button to search -->
    <div class="search">
      <input id="cityInput" type="text" placeholder="Type a city, e.g. Hanoi" value="Vung Tau">
      <button id="searchBtn">Search</button>
    </div>

    <!-- The weather card. Right now it's empty. JavaScript fills it in! -->
    <section class="card">
      <p id="cityName">Loading...</p>
      <p id="icon" class="icon"></p>
      <p id="temp" class="temp"></p>
      <p id="description"></p>
      <p id="details"></p>
    </section>
  </main>

  <!-- This connects our brain file (JavaScript). It goes LAST. -->
  <script src="script.js"></script>
</body>
</html>
